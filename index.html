<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e131a"><link rel="manifest" href="manifest.webmanifest">
<title>My Fitness</title>
<style>
:root{--bg:#0e131a;--card:#171e28;--card2:#1e2733;--line:#273243;--tx:#f1f4f9;--mut:#8b97a8;--ac:#5b8def;--ac2:#7aa5ff;--ok:#4ac26b;--warn:#e8c547;--bad:#ea6a62}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:0 16px 96px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
h1,h2,h3{margin:0}
.top{display:flex;align-items:center;gap:8px;padding:14px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.top .ttl{flex:1;text-align:center;font-weight:600}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--mut)}
.ib:active{background:var(--card2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:600}
.btn{background:var(--ac);color:#fff;border-radius:14px;padding:13px 16px;width:100%;font-weight:600;text-align:center}
.btn.ghost{background:transparent;border:1px solid var(--ac);color:var(--ac2)}
.btn.dim{background:var(--card2);color:var(--tx)}
.btn.red{background:transparent;color:var(--bad)}
.btn.sm2{width:auto;padding:8px 14px;border-radius:12px;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1017;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav>div{display:flex;width:100%;max-width:480px}
.nav button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button i{font-style:normal;font-size:20px}
.nav button.on{color:var(--ac2)}
.week{display:flex;justify-content:space-between;margin:6px 0 4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mut);width:13%}
.day .c{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--tx);position:relative;background:conic-gradient(var(--ac) calc(var(--p)*1%),#2a3340 0)}
.day .c b{width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:500}
.day.sel{color:var(--ac2)}.day.sel .c b{background:var(--ac);color:#fff}
.day.today .c b{border:1px solid var(--ac)}
.chk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0;width:100%;text-align:left}
.chk .ic{width:40px;height:40px;border-radius:10px;background:#1c2a47;display:grid;place-items:center;color:var(--ac2);font-size:19px}
.chk.done .ic{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.chk .tick{width:24px;height:24px;border-radius:50%;background:var(--ok);color:#06210f;display:grid;place-items:center;font-size:14px;font-weight:700}
.bar{height:8px;background:#2a3340;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac);border-radius:6px}
.bar.over>i{background:var(--bad)}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;background:#1c2a47;color:var(--ac2)}
.pill.p{background:#2c2147;color:#b79bff}.pill.g{background:#173a26;color:var(--ok)}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;margin:10px 0}
.seg button{flex:1;padding:9px;border-radius:11px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--tx);font-weight:600}
.ex{display:flex;align-items:center;gap:12px;padding:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;width:100%;text-align:left}
.ex .th{width:44px;height:44px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:12px;color:var(--ac2);font-weight:700;flex:none}
.acard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0}
.acard h3{font-size:16px;color:var(--ac2)}
.done-b{display:inline-block;font-size:11px;color:var(--ok);background:#173a26;border-radius:8px;padding:2px 8px;margin-top:3px}
.sh{display:grid;grid-template-columns:34px 1fr 74px 74px 44px;gap:8px;align-items:center;font-size:12px;color:var(--mut);padding:8px 0 4px}
.sr{display:grid;grid-template-columns:34px 1fr 74px 74px 44px;gap:8px;align-items:center;padding:6px 0;border-radius:10px}
.sr.ok{background:#1a2c26}
.sr .n{width:28px;height:28px;border-radius:8px;background:#0e131a;display:grid;place-items:center;font-size:14px}
.sr input{text-align:center;padding:8px 4px;font-size:18px;font-weight:600;background:#0e131a}
.sr .ck{width:30px;height:30px;border-radius:50%;border:2px solid #3a475b;margin:auto}
.sr.ok .ck{color:#101418;display:grid;place-items:center;font-weight:700}.sr.ok .ck.easy{background:var(--ok);border-color:var(--ok)}.sr.ok .ck.ideal{background:var(--warn);border-color:var(--warn)}.sr.ok .ck.max{background:var(--bad);border-color:var(--bad)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:4px;background:var(--mut)}
.dot.easy{background:var(--ok)}.dot.ideal{background:var(--warn)}.dot.max{background:var(--bad)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#141b25;border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:88vh;overflow:auto;padding:12px 16px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.sheet .grab{width:44px;height:4px;background:#3a475b;border-radius:3px;margin:0 auto 12px}
.opt{display:block;width:100%;text-align:left;padding:13px 6px;border-bottom:1px solid var(--line)}
.opt.red{color:var(--bad)}
.eff{display:block;width:100%;text-align:left;border-radius:14px;padding:13px 15px;margin:9px 0;border:1px solid}
.eff.easy{background:#173a26;border-color:#2c7a4a}.eff.ideal{background:#3a3417;border-color:#8a7a2a}.eff.max{background:#3d2220;border-color:#8a3b36}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2a3340;padding:10px 16px;border-radius:12px;z-index:40;font-size:14px}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);background:#0b1017;border-top:1px solid var(--ac)}
.restbar>div{max-width:480px;width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px}
.big{font-size:30px;font-weight:700}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#0e131a;border:1px solid var(--line);border-radius:16px;padding:18px}
.stepper .v{font-size:44px;font-weight:700}
.stepper button{font-size:30px;color:var(--ac2);width:44px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.lbl{font-size:12px;color:var(--mut);margin:10px 0 4px;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muscle{display:flex;gap:8px;overflow:auto;padding:2px 0}
.muscle .card{margin:0;min-width:96px;padding:10px;text-align:center}
svg text{fill:#8b97a8;font-size:10px}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--card2);color:var(--mut)}
.h3b{text-align:left;display:block}.prevb{color:var(--ac2);text-align:center;padding:6px 2px;border-radius:8px;background:#1a2538}.prevh{font-size:12px;color:var(--ac2);text-align:center}.acard{scroll-margin-top:76px}
.swrap{position:relative;overflow:hidden;border-radius:10px}.swrap .sr{transition:transform .2s;background:var(--card)}.swrap .sr.ok.easy{background:#1a2c26}.swrap .sr.ok.ideal{background:#2c2a19}.swrap .sr.ok.max{background:#2e1d1d}.swrap.sw .sr{transform:translateX(-72px)}
.sdel{position:absolute;right:0;top:0;bottom:0;width:68px;background:var(--bad);border-radius:10px;color:#fff;font-size:18px}.swrap:not(.sw) .sdel{display:none}
input[type=checkbox]{width:auto}.steprow{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
</style>
</head>

<script>
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fd=(s,y)=>{const d=parse(s);return MON[d.getMonth()]+' '+d.getDate()+(y?', '+d.getFullYear():'')};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10;
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const fmtT=s=>Math.floor(s/60)+':'+pad(Math.max(0,Math.floor(s%60)));
const fkg=n=>(Math.round(n*100)/100).toString();

/* ============ library, form guides & seed ============ */
/* Exercise names/groups transcribed from the Fitness2 recording. Form steps: Built with Science cues where their pages cover the lift
   (barbell row, squat, deadlift/RDL, hip thrust, Bulgarian split squat, step-ups, incline press, seated cable fly, preacher/behind-body curls,
   overhead triceps extensions, chest-supported & lat-focused rows, reverse crunch, etc.), otherwise standard coaching cues. Edit any in-app via "My notes". */
const LIBRAW={
Chest:['Low Incline Dumbbell Press','Decline Dumbbell Press','Flat Dumbbell Press','Barbell Bench Press','Low Incline Barbell Press','Incline Machine Chest Press','Low Incline Smith Machine Press','Decline Machine Chest Press','Chest Dips','Flat Smith Machine Chest Press','Seated Mid-Chest Cable Fly','Standing High To Low Cable Flyes','Low Incline Cable Press','Seated Flat Cable Press','Flat Machine Chest Press','Low to High Cable Fly','Standing Mid-Chest Cable Fly','Push-Ups (bands optional)','Decline Push-Ups (bands optional)','Incline Push-Ups (bands optional)','Weakpoint Pause Bench Press','Pec-Deck Machine Fly','Banded Standing Underhand Fly','Neutral Grip Dumbbell Press (*Shoulder Friendly)','Standing Underhand Dumbbell Fly','Dumbbell Fly','Supine Press Machine','Push-Ups (bands optional) (Rest-Pause)','(Bodyweight) Dip Push-Ups','(Bodyweight) Inner Chest Push-Up','Dumbbell Floor Press','Machine Assisted Chest Dips'],
Shoulders:['Rear Delt Cable Fly','Cable Lateral Raise','Prone Arm Circles','Seated Dumbbell Shoulder Press','Standing Barbell Overhead Press','Reverse Pec Deck','Chest Supported Dumbbell Rear Delt Row','Rear Delt Cable Row','Dumbbell Lateral Raises','Lying Incline Lateral Raise','LU Raises','Standing Dumbbell Shoulder Press','Dumbbell Single Arm Rear Delt Row','Lean In Lateral Raise','Half Kneeling Landmine Press (*shoulder friendly)','Wide Grip Barbell Upright Row','Dumbbell Reverse Flyes','Arnold Press','Seated Neutral-Grip Dumbbell Shoulder Press (*shoulder friendly)','Standing Banded Shoulder Press','Banded Kneeling Rear Delt Row','Pike Pushup','Banded Lateral Raises','Lateral Raise (Machine)','Shoulder Press (Machine)','Front Raises','Banded Standing Reverse Flyes','Chest-to-Wall Handstand','Pike Push-up'],
Biceps:['Lying Dumbbell Curls','Behind Body Cable Curls','Dumbbell Preacher Curl','Incline Dumbbell Curls','Seated Dumbbell Curls','Hammer Curls','Standing Barbell Curl','Rope Cable Curls (*neutral grip)','Standing Cable Curls','Dumbbell Spider Curls','EZ-Bar Bicep Curl','Standing Dumbbell Curls','Preacher Curl (Machine)','Preacher Curl (Barbell)','Banded Bicep Curls'],
Triceps:['Single Arm Overhead Rope Extensions','Rope Overhead Tricep Extensions','Incline Dumbbell Overhead Extensions','Cable Pushdowns (*elbow friendly)','Cross Cable Tricep Extensions','JM Press','Close-Grip Smith Machine Press','Close Grip Dumbbell Press','Tricep Dips','Tricep Bar Pushdowns','Close-Grip Barbell Bench Press','Incline Barbell Skullcrushers','Dumbbell Overhead Tricep Extensions','Bodyweight Tricep Extensions','Bodyweight Close-Grip Push-Ups','Triceps Kickback','Banded Single Arm Overhead Extensions','Banded Tricep Pushdown','Machine Assisted Tricep Dips'],
Forearms:['Reverse Curls (Dumbbell)','Wrist Extension (Dumbbell)','Forearm Push-Ups','Incline Hammer Preacher Curl','Wrist Extensions (Cables)','Wrist Curls (Cable)','Reverse Curls (Cables)','Wrist Curls (Dumbbell)','Dead Hang',"Farmer's Carry/Walk"],
Back:['Pull-Ups','Lat Focused Cable Row','Chin-Ups','Lat Pulldowns','Wall Slides','Cat Cow','Dumbbell Chest Supported Row (mid/upper back focused)','Standing Face Pulls','Kneeling One Arm Lat Pulldown','Chest Supported Machine Row','Half-Kneeling Cable Row','(Weighted) Prone Arm Circles','Meadows Row','Seated Cable Row (mid/upper back focused)','Band Assisted Pull-Ups','Chest Supported Dumbbell Row (lat focused)','Inverted Row','Bent Over Dumbbell Face Pulls','Barbell Row (Lat Focused)','Barbell Row (mid/upper back focused)','Pull-Up Negatives','3 Point Dumbbell Row','Banded Face Pulls','Dumbbell Pullovers','Kneeling Lat Pulldowns','Banded Single Arm Lat Pulldown','T-Bar Row','Close-Grip Underhand Lat Pulldown','Banded Straight Arm Pulldown','Banded Bent Over Row','Banded Kneeling One Arm Row','Machine Assisted Chin-Ups','Front Lever','Muscle-up','Chest to Bar Pull-ups','Machine Assisted Pull-Ups','High Pulls'],
Glutes:['Barbell Deadlift','Barbell Hip Thrust','Barbell Hip Thrust Progression','Dumbbell Romanian Deadlift','Cable Kickbacks','Glute Bridges',"World's Greatest Stretch",'Hip Abduction Machine','Hip Thrust Machine','Banded Hip Abductions','Bulgarian Split Squat (Glute Focused)','Side Lying Hip Raise','Weighted Step Ups (*knee friendly)','Barbell Deadlift Progression','Front Foot Elevated Reverse Lunges','Lateral Band Walk','Curtsy Lunges','(Weighted) Single Leg Hip Thrusts','Smith Machine Hip Thrust','Glute Focused Leg Press','Reverse Lunges (*knee friendly)','Hyperextensions (Glute Focused)','Glute-Focused Step Downs','Banded Donkey Kicks','Single-Leg Leg Press','Side Lying Leg Raise','Bodyweight Bulgarian Split Squats (Glute Focused)','Sumo Deadlift (*lower back friendly)','Trap Bar Deadlift (*lower back friendly)','(Bodyweight) Single Leg Hip Thrusts','Banded Deadlift','Bodyweight Sliding Reverse Lunges','Bodyweight Assisted Single Leg Lunge','Bench Reverse Hyperextensions','Banded Split Squat (Glute Focused)','Kettlebell Swing','Bodyweight Step-Ups'],
Quadriceps:['Barbell Back Squat','Barbell Back Squat Progression','Asian Squat','Bulgarian Split Squat (Quad Focused)','Hack Squat Machine','Smith Machine Squat','Front Squat','Quad-Focused Leg Press','Seated Leg Extensions','Walking Lunges (Quad Focused)','Heel Elevated Split Squat','Bodyweight Sissy Squat','Heel Elevated Goblet Squat','Barbell Back Box Squat (*knee friendly)','Bodyweight Bulgarian Split Squats (Quad Focused)','Goblet Squat (*lower back friendly)','Zercher Squat','Belt Squat','Banded Goblet Squat','Pistol Squat','Pendulum Squat','Bodyweight Goblet Squats','Banded Split Squat (Quad Focused)','Bodyweight Compressions','Single-Leg Leg Press','Weighted Step Ups (*knee friendly)','Bodyweight Step-Ups','Reverse Lunges (*knee friendly)'],
Hamstrings:['Barbell Romanian Deadlift','Seated Leg Curls','Hyperextensions (back/hamstring focused)','Barbell Good Mornings','Lying Leg Curls','Dumbbell Romanian Deadlift (Hamstring Focused)','Glute Ham Raise','Swiss Ball Leg Curls','Bodyweight Sliding Hamstring Curls','Dumbbell Lying Leg Curls','Nordic Hamstring Curl','Single-Leg Romanian Deadlift','Banded Hamstring Curls'],
Calves:['Leg Press Calf Raises','Toes-Elevated Smith Machine Calf Raises','Standing Weighted Calf Raises (Barbell or Dumbbell)','Single Leg Weighted Calf Raise','Seated Weighted Calf Raises','Seated Bodyweight Calf Raises','Bodyweight Single Leg Calf Raises','Standing Calf Raise (Machine)','Tibialis Raise'],
Core:['Dead Bug','Bird Dog','RKC Plank','Side Plank','Palloff Press','Russian Twists','Lying Windshield Wipers'],
Abs:['Reverse Crunches','Cable Crunches','Decline Weighted Sit Ups','Hanging Leg Raises','Weighted Crunches','Ab Roller','Bodyweight V-Ups','Bodyweight Lying Leg Raises','Bodyweight Mountain Climbers','Bodyweight Bicycle Kicks','Bodyweight Hollow Body Hold','Ab Crunch','Assisted Lat Pulldown Crunch','Dragon Flag','Ab Mat Reverse Crunches','Kneeling Cable Crunch (Facing Away)','Lat Pulldown Cable Crunch (Facing Away)',"Captain's Chair Leg Raise",'Standing Cable Crunch (Facing Away)','Unassisted Lat Pulldown Crunch','Garhammer Hold','Garhammer Raise','Bodyweight Butterfly Kicks','Lat Pulldown Cable Crunch (Facing Machine)','Ab Mat Crunch'],
Traps:['Barbell Shrugs','Dumbbell Shrugs','Cable Shrugs','Scapular Pull-ups'],
Adductors:['Hip Adduction Machine']
};
const MUSCLES=Object.keys(LIBRAW);
const exId=n=>'e_'+n.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');

/* --- form-guide engine: specific cues first (OV), then movement families (FAM), then modifiers --- */
const OV=[
[/^lat pulldowns$|^close-grip underhand lat pulldown|^kneeling lat pulldowns/i,['Adjust the thigh pad so your legs are locked in, feet flat. Grip the bar a little wider than shoulder-width; hands act as hooks.','Lean back slightly, chest up, and start the pull by driving your elbows down toward your back pockets (not by pulling with the hands).','Pull the bar to your upper chest, squeezing the lats. Do not swing or lean back more as you tire.','Return the bar slowly until your arms are fully straight and your lats are stretched, then repeat.'],'Thumbless grip and thinking "elbows to hips" helps you feel the lats instead of the biceps.'],
[/^kneeling one arm lat pulldown|^banded single arm lat pulldown/i,['Kneel side-on to the cable with the handle at head height or above; sit tall with ribs down.','Start with the arm long and the shoulder blade stretched up.','Pull the elbow down and back toward your hip, finishing with the upper arm beside your body.','Control the return all the way up; keep the torso still and complete all reps before switching sides.'],''],
[/^barbell row \(lat focused\)/i,['Feet a bit wider than hip-width with the bar over mid-foot. Hinge until your torso is roughly 15–45° from upright (as far as hamstring flexibility allows), back neutral.','Grip just outside the knees, brace your core, and keep the chest up.','Row with the elbows driving up and slightly back toward your hips; squeeze the shoulder blades at the top.','Let the arms straighten fully and lower under control. Do not flare the elbows or let the shoulders roll forward.'],'A narrower grip pulls toward the belly button and hits the lats more; a wider grip pulls toward the sternum and hits the upper back more. (Built with Science)'],
[/^barbell row \(mid\/upper back focused\)|^banded bent over row|^high pulls/i,['Set up as for a bent-over row: feet slightly wider than hips, bar over mid-foot, torso 15–45° from upright with a neutral back.','Use a slightly wider grip so the bar travels toward the lower sternum.','Row with elbows out at roughly 45–60° from the torso, squeezing the shoulder blades together.','Lower with control until the arms are straight; keep the chest up and avoid shrugging.'],'Do not go so upright that the rep turns into a shrug. (Built with Science)'],
[/^t-bar row|^meadows row/i,['Take an athletic hinge stance, back flat, chest up, core braced.','Row the handle/bar toward your lower ribs, keeping the elbow around 45–60° from the torso.','Squeeze the shoulder blades at the top; pause briefly.','Lower under control to a full stretch without rounding the back or twisting the torso.'],'Meadows row: smaller plates give more range of motion; use a strap if grip limits you. (Built with Science)'],
[/chest supported dumbbell row \(lat|chest supported dumbbell rear delt|dumbbell chest supported row|chest supported machine row/i,['Set the bench to about 45° and lie chest-down with feet planted and legs slightly bent (machine: adjust the chest pad so the handles are reachable with arms long).','Let the shoulder blades open fully at the bottom.','Row the elbows back in an arrow shape (about 45° from the body; wider and out for rear delts), keeping forearms vertical.','Squeeze the shoulder blades at the top, then lower slowly; do not lift the chest off the pad.'],'Vertical forearms stop the biceps from taking over. (Built with Science)'],
[/^seated cable row|^lat focused cable row|^half-kneeling cable row|^rear delt cable row/i,['Sit tall with a slight forward lean, feet braced, chest up and ribs down; arms long to start.','Start the pull by retracting the shoulder blades, then drive the elbows back (close to the body for lats, wider for mid/upper back).','Pull the handle to your lower ribs, pause and squeeze.','Return slowly until the shoulder blades fully protract. Do not rock the torso back and forth.'],''],
[/3 point dumbbell row|single arm dumbbell row|^dumbbell single arm rear delt/i,['Support yourself with one hand and the same-side knee on a bench; back flat, other foot out for stability.','Keep the elbow tight to your side and drive it back toward your hip in a slight arc (wider and out for rear delts).','Keep the forearm vertical, do not rotate the torso, and pull until the elbow passes the torso.','Lower under control to a full stretch; finish all reps before switching sides.'],'Built with Science cue: elbow tight, forearm vertical, torso still.'],
[/^pull-ups$|^chin-ups$|^chest to bar|^machine assisted (pull|chin)|^band assisted|^muscle-up/i,['Start from a dead hang with an overhand grip (underhand for chin-ups) just outside shoulder width. Squeeze glutes, ribs down.','Shrug the shoulders down and away from your ears first to engage the lats.','Pull your elbows down toward your ribs until your chin clears the bar (chest to bar for chest-to-bar pull-ups).','Lower slowly to a full hang. Avoid kipping or swinging unless the exercise calls for it.'],'Assisted variants: use just enough assistance to keep every rep full-range.'],
[/^pull-up negatives/i,['Step or jump to the top position, chin over the bar.','Hold briefly, then lower yourself as slowly as you can (3–5 seconds).','Linger in the hardest part of the range.','Reset to the top with the box/bench and repeat.'],'Built with Science: lower as slowly as possible.'],
[/^inverted row/i,['Set a bar at about hip height. Hang underneath with arms straight, body in a straight line, core tight, glutes squeezed, legs straight.','Pull your chest to the bar by driving the elbows toward the bar.','Squeeze the shoulder blades together at the top.','Lower under control. To make it harder, lower the bar or raise your feet.'],''],
[/^barbell back squat|^front squat|^barbell back box|^smith machine squat|^zercher|^belt squat|^pendulum|^hack squat/i,['Set the bar/pads at a height that lets you unrack easily; feet about shoulder-width (a bit wider with toes slightly out is fine).','Take a big breath, brace the core, and sit down and slightly back, keeping your whole foot on the floor.','Descend as deep as you can with good form (upper thighs at least parallel); knees track over the toes.','Drive up through mid-foot, keeping the chest up. Exhale at the top.'],'A more upright torso emphasizes quads; more forward lean emphasizes glutes. If you struggle to get deep, raise your heels on small plates. (Built with Science)'],

function stepsFor(name){
  const base=name.replace(/\s*\(\*[^)]*\)/g,'');
  let steps=null,tip='';
  for(const [re,s,t] of OV){if(re.test(base)){steps=s.slice();tip=t;break}}
  if(!steps){steps=['Set up with a stable, braced position and control the weight through the full range of motion.','Move only the target joint(s); do not use momentum.','Pause briefly at the point of peak contraction, then lower slowly.','Stop the set when your form starts to break down.'];tip=''}
  const l=name.toLowerCase();
  if(/banded|band/.test(l)&&!/band assisted/.test(l))steps.push('Anchor the band securely and keep constant tension on it through the whole rep.');
  if(/machine|smith/.test(l)&&!/ab mat|assisted/.test(l))steps.push('Adjust the seat/pads so the machine\'s pivot lines up with the working joint before you start.');
  if(/\(\*shoulder friendly\)|neutral.grip/.test(l))tip=(tip?tip+' ':'')+'Shoulder-friendly variation: the neutral grip keeps the shoulder joint in a more comfortable position.';
  if(/\*knee friendly/.test(l))tip=(tip?tip+' ':'')+'Knee-friendly variation: keep the shin more vertical and avoid knee cave.';
  if(/\*lower back friendly/.test(l))tip=(tip?tip+' ':'')+'Lower-back-friendly variation: keep a more upright torso.';
  if(/\*elbow friendly/.test(l))tip=(tip?tip+' ':'')+'Elbow-friendly variation: use a comfortable grip and keep the elbows tucked.';
  return{steps,tip};
}
function defs(name){const l=name.toLowerCase();let sets=3,lo=8,hi=12,rest=90,side=false;
  if(/barbell (back )?squat|front squat|barbell deadlift|sumo deadlift|trap bar|barbell bench|barbell hip thrust|standing barbell overhead|zercher/.test(l)&&!/progression/.test(l)){lo=5;hi=8;rest=180}
  else if(/deadlift|squat|press|row|pulldown|pull-up|chin-up|dip|lunge|thrust|leg press|step/.test(l)){lo=8;hi=12;rest=120}
  else if(/calf|tibialis|crunch|raises|ab |v-ups|hollow|bicycle|russian|mountain|butterfly|sit up/.test(l)&&!/lateral raise|front raise|lu raises/.test(l)){lo=10;hi=20;rest=60}
  else if(/curl|extension|fly|flye|lateral|reverse|kickback|pushdown|shrug|face pull|abduction|adduction|pullover/.test(l)){lo=10;hi=15;rest=75}
  if(/plank|dead bug|bird dog|hold|dead hang|carry|windshield|palloff/.test(l)){lo=20;hi=45;rest=60}
  if(/single|one arm|bulgarian|split squat|lunge|step-up|step up|step down|pistol|kickback|side lying|side plank|palloff|unilateral|donkey/.test(l))side=true;
  return{sets,lo,hi,rest,side}}

const dateOf=s=>parse(s).getDay();
const plan=()=>S.plans[S.activePlan]||Object.values(S.plans)[0];
const wkFor=date=>{const p=plan();const id=p&&p.days[dateOf(date)];return id?S.workouts[id]:null};
const logOn=date=>S.logs.find(l=>l.date===date);
const exName=id=>EXD(id).name;
const initials=n=>n.split(/[\s(]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const vol=(sets)=>sets.reduce((a,s)=>a+num(s.kg)*num(s.reps),0);
const logVol=l=>l.exercises.reduce((a,e)=>a+vol(e.sets),0);
function prevSets(exId,beforeDate){ // most recent completed session before date
  for(let i=S.logs.length-1;i>=0;i--){const l=S.logs[i];if(beforeDate&&l.date>=beforeDate&&l!==S._cur)continue;
    const e=l.exercises.find(x=>x.ex===exId&&x.sets.length);if(e)return{sets:e.sets,log:l}}return null}
function fitem(e){ // food log entry -> numbers
  const q=e.qty||1;
  if(e.quick)return{name:e.quick.name||'Quick log',sub:'Quick log',kcal:e.quick.kcal,p:e.quick.p,c:e.quick.c,f:e.quick.f};
  if(e.meal){const m=S.meals[e.meal];if(!m)return{name:'(deleted)',sub:'',kcal:0,p:0,c:0,f:0};const t=mealTot(m);return{name:m.name,sub:q+' × meal',kcal:t.kcal*q,p:t.p*q,c:t.c*q,f:t.f*q}}
  const f=S.foods[e.food];if(!f)return{name:'(deleted food)',sub:'',kcal:0,p:0,c:0,f:0};
  return{name:f.name,sub:(q!==1?q+' × ':'')+f.unit+(f.brand?' · '+f.brand:''),kcal:f.kcal*q,p:f.p*q,c:f.c*q,f:f.f*q}}
function mealTot(m){if(m.fixed)return m.fixed;return m.items.reduce((a,i)=>{const f=S.foods[i.food];if(!f)return a;const q=i.qty||1;a.kcal+=f.kcal*q;a.p+=f.p*q;a.c+=f.c*q;a.f+=f.f*q;return a},{kcal:0,p:0,c:0,f:0})}
const totalCount=()=>(S.baseCount==null?142:S.baseCount)+S.logs.filter(l=>l.counted).length;
function weekStats(date){const ws=addDays(date,-dateOf(date)),we=addDays(ws,6);const sets={};const days=new Set();
  S.logs.filter(l=>l.date>=ws&&l.date<=we).forEach(l=>{days.add(l.date);l.exercises.forEach(e=>{const m=EXD(e.ex).muscle;sets[m]=(sets[m]||0)+e.sets.length})});
  const p=plan();const planned={};let sched=0;
  if(p)p.days.forEach(id=>{if(id&&S.workouts[id]){sched++;S.workouts[id].items.forEach(i=>{const m=EXD(i.ex).muscle;planned[m]=(planned[m]||0)+(+i.sets||0)})}});
  Object.keys(sets).forEach(m=>{if(!planned[m])planned[m]=sets[m]}); // trained but not in the plan: counts as met
  const tot=Object.values(planned).reduce((a,b)=>a+b,0);
  const got=Object.keys(planned).reduce((a,m)=>a+Math.min(planned[m],sets[m]||0),0);
  return{sets,planned,done:days.size,sched:Math.max(sched,days.size),cov:tot?Math.round(got/tot*100):0}}
function newPRs(l){const out=[];l.exercises.forEach(e=>{const mx=Math.max(...e.sets.map(x=>num(x.kg)));let prior=0;S.logs.forEach(o=>{if(o===l||o.date>l.date)return;o.exercises.filter(x=>x.ex===e.ex).forEach(x=>x.sets.forEach(y=>{prior=Math.max(prior,num(y.kg))}))});if(prior>0&&mx>prior)out.push({name:exName(e.ex),kg:mx})});return out}
const CMP=[['cricket bat','cricket bats',1.2,'🏏'],['laptop','laptops',2,'💻'],['newborn baby','newborn babies',3.5,'👶'],['house cat','house cats',4,'🐈'],['bowling ball','bowling balls',7,'🎳'],['LPG cylinder','LPG cylinders',14.2,'🧯'],['car battery','car batteries',14,'🔋'],['packed suitcase','packed suitcases',23,'🧳'],['golden retriever','golden retrievers',30,'🐕'],['sack of cement','sacks of cement',50,'🧱'],['washing machine','washing machines',70,'🧺'],['giant panda','giant pandas',100,'🐼'],['scooter','scooters',100,'🛵'],['lion','lions',190,'🦁'],['Royal Enfield Bullet','Royal Enfield Bullets',190,'🏍'],['Bengal tiger','Bengal tigers',220,'🐅'],['grand piano','grand pianos',300,'🎹'],['auto-rickshaw','auto-rickshaws',400,'🛺'],['horse','horses',500,'🐎'],['cow','cows',650,'🐄'],['small car','small cars',1000,'🚗'],['great white shark','great white sharks',1100,'🦈'],['giraffe','giraffes',1200,'🦒'],['hippopotamus','hippopotamuses',1500,'🦛'],['rhinoceros','rhinoceroses',2300,'🦏'],['orca','orcas',4500,'🐳'],['elephant','elephants',5500,'🐘'],['T. rex','T. rexes',8000,'🦖'],['school bus','school buses',11000,'🚌'],['fire engine','fire engines',12000,'🚒'],['Boeing 737','Boeing 737s',41000,'✈️']];
function cmpFor(l){if(l.cmp&&CMP[l.cmp])return l.cmp;const vv=logVol(l);
  let prev=null;for(let i=S.logs.length-1;i>=0;i--){const o=S.logs[i];if(o!==l&&o.cmp!=null){prev=o.cmp;break}}
  let ok=CMP.map((c,i)=>i).filter(i=>{const n=vv/CMP[i][2];return n>=1.5&&n<=150&&i!==prev});
  if(!ok.length)ok=CMP.map((c,i)=>i).sort((a,b)=>Math.abs(Math.log(vv/CMP[a][2]))-Math.abs(Math.log(vv/CMP[b][2]))).slice(0,3);
  l.cmp=ok[Math.floor(Math.random()*ok.length)];save();return l.cmp}
function cmpText(l){const c=CMP[cmpFor(l)];const n=logVol(l)/c[2];const shown=n>=10?Math.round(n):Math.round(n*10)/10;return{ic:c[3],txt:shown+' '+(shown===1?c[0]:c[1])}}

function dayFood(date){const d=S.foodLog[date]||{};const t={kcal:0,p:0,c:0,f:0,n:0};for(const m of MEALS)for(const e of d[m]||[]){const i=fitem(e);t.kcal+=i.kcal;t.p+=i.p;t.c+=i.c;t.f+=i.f;t.n++}return t}
function mealTotals(date,m){const t={kcal:0,p:0,n:0};for(const e of(S.foodLog[date]||{})[m]||[]){const i=fitem(e);t.kcal+=i.kcal;t.p+=i.p;t.n++}return t}
function lastWeight(upTo){const ds=Object.keys(S.weights).filter(d=>d<=upTo).sort();const d=ds[ds.length-1];return d?{d,w:S.weights[d]}:null}
function streak(){let n=0,d=today();const act=x=>S.weights[x]||logOn(x)||dayFood(x).n;if(!act(d))d=addDays(d,-1);while(act(d)){n++;d=addDays(d,-1)}return n}
function dayProgress(date){let t=0,k=0;t++;if(S.weights[date])k++;if(wkFor(date)||logOn(date)){t++;if(logOn(date))k++}t++;if(dayFood(date).n)k++;return k/t*100}

function line(pts,{h=150,fmt=v=>r1(v)}={}){
  if(pts.length<1)return '<div class="mut sm" style="padding:20px 0;text-align:center">No data yet</div>';
  const W=320,H=h,P=26;const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}const pd=(mx-mn)*.15;mn-=pd;mx+=pd;
  const X=i=>pts.length===1?W/2:P+i*(W-2*P)/(pts.length-1),Y=y=>H-P-(y-mn)/(mx-mn)*(H-2*P);
  const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><path d="${path}" fill="none" stroke="#5b8def" stroke-width="2"/>`+
   pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="#5b8def"/>`).join('')+
   `<text x="2" y="${Y(Math.max(...ys))-6}">${fmt(Math.max(...ys))}</text><text x="2" y="${Y(Math.min(...ys))+14}">${fmt(Math.min(...ys))}</text>`+
   `<text x="${P}" y="${H-4}">${esc(pts[0].l||'')}</text><text x="${W-P}" y="${H-4}" text-anchor="end">${esc(pts[pts.length-1].l||'')}</text></svg>`}

function vProg(){

 case'addW':{const groups=Object.values(S.plans).map(p=>({name:p.name,ids:[...new Set(p.days.filter(Boolean))]})).filter(g=>g.ids.length);const used=new Set(groups.flatMap(g=>g.ids));const saved=Object.keys(S.workouts).filter(id=>!used.has(id));if(saved.length)groups.push({name:'My Saved Workouts',ids:saved});

/* exercise picker body */
function pickBody(s){const q=(s.q||'').toLowerCase().trim();const all=allEx().sort((a,b)=>a.name.localeCompare(b.name));const multi=s.mode==='add'||s.mode==='wadd';s.sel=s.sel||{};
  const row=e=>`<button class="ex" data-a="pickEx" data-e="${e.id}"><div class="th">${initials(e.name)}</div><div class="sp">${esc(e.name)}<div class="xs mut">${e.muscle}</div></div>${multi?`<span style="width:22px;height:22px;border-radius:50%;flex:none;border:2px solid ${s.sel[e.id]?'var(--ac)':'#3a475b'};background:${s.sel[e.id]?'var(--ac)':'transparent'}"></span>`:''}</button>`;
  let h='';
  if(q)h=all.filter(e=>e.name.toLowerCase().includes(q)).map(row).join('')||'<div class="mut sm">No match.</div>';
  else{h=`<div class="seg" style="margin-top:0"><button class="${s.m?'':'on'}" data-a="pickTab" data-m="">All (${all.length})</button><button class="${s.m?'on':''}" data-a="pickTab" data-m="${s.m||MUSCLES[0]}">By muscle</button></div>`;
    if(s.m)h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${MUSCLES.map(m=>`<button class="tag" style="${m===s.m?'background:var(--ac);color:#fff':''}" data-a="pickTab" data-m="${m}">${m} ${all.filter(e=>(e.muscles||[e.muscle]).includes(m)).length}</button>`).join('')}</div>`+all.filter(e=>(e.muscles||[e.muscle]).includes(s.m)).map(row).join('');
    else h+=all.map(row).join('')}
  return h+`<div style="text-align:center;margin:14px 0 4px" class="sm mut">Can't find what you're looking for?<button class="btn ghost" style="margin-top:8px" data-a="newEx">Create new exercise</button></div>`}

A.mailOpen=()=>{location.href='mailto:?subject='+encodeURIComponent('My Fitness backup '+today())+'&body='+encodeURIComponent('Attach the downloaded backup file (myfitness-backup-'+today()+'.json). Restore it via Settings → Import backup.')};
A.shareLog=async d=>{const l=S.logs.find(x=>x.id===d.id);if(!l)return;
  const txt=`🏋 ${l.name} — ${DOWL[dateOf(l.date)].slice(0,3)}, ${fd(l.date,1)}\nVolume ${Math.round(logVol(l)).toLocaleString()} kg${l.dur?' · '+l.dur+' min':''}\n\n`+l.exercises.map(e=>'• '+exName(e.ex)+': '+e.sets.map(s=>fkg(s.kg)+'kg×'+s.reps).join(', ')).join('\n');
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==='AbortError')return}
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')};
let tsw=null;document.addEventListener('touchstart',e=>{const w=e.target.closest('.swrap');tsw=w?{x:e.touches[0].clientX,w}:null},{passive:true});
document.addEventListener('touchend',e=>{if(!tsw)return;const dx=e.changedTouches[0].clientX-tsw.x;if(dx<-45){document.querySelectorAll('.swrap.sw').forEach(x=>x.classList.remove('sw'));tsw.w.classList.add('sw')}else if(dx>30)tsw.w.classList.remove('sw');tsw=null},{passive:true});
A.reset=()=>{if(confirm('Delete ALL data on this device and start fresh?')&&confirm('Really delete everything? Export a backup first if unsure.')){localStorage.removeItem(KEY);S=seed();save();ui.stack=[];render(false)}};

/* ============ events ============ */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='scrim'){if(ev.target===el)closeSheet();return}
  const f=A[el.dataset.a];if(f)f(el.dataset,el,ev)});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='pq'){ui.sheet.q=t.value;$('#plist').innerHTML=pickBody(ui.sheet)}
  if(t.id==='fq'){ui.sheet.q=t.value;renderFoodList()}});
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset.in;if(!k)return;const D=t.dataset;
  switch(k){
  case'kg':case'reps':S.active.exercises[D.ei].sets[D.si][k]=t.value===''?'':num(t.value);break;
  case'note':S.active.exercises[D.ei].notes=t.value;break;
  case'exnote':S.exnotes[D.e]=t.value;break;
  case'csteps':S.custom[D.e].steps=t.value.split('\n').map(x=>x.trim()).filter(Boolean);break;
  case'wside':S.workouts[D.w].items[D.n].side=t.checked;break;
  case'pname':S.plans[D.id].name=t.value.trim()||S.plans[D.id].name;break;
  case'wname':S.workouts[D.w].name=t.value.trim()||S.workouts[D.w].name;break;
  case'wi':S.workouts[D.w].items[D.n][D.k]=Math.max(0,Math.round(num(t.value)));break;
  case'base':S.baseCount=Math.max(0,Math.round(num(t.value)));break;
  case'sname':S.name=t.value.trim()||'Friend';break;
  case'tgt':S.tgt[D.k]=num(t.value);break;
  case'tgt2':S.tgt[D.k][+D.j]=num(t.value);break;
  case'exSel':ui.exSel=t.value;save();render();return;
  case'import':{const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.logs||!o.workouts)throw 0;if(!confirm('Replace ALL current data with this backup?'))return;if(o.v===2)S=o;else{S=seed();migrate(o)}save();ui.stack=[];render(false);toast('Backup restored')}catch(e){toast('Not a valid backup file')}};r.readAsText(f);return}
  }
  save()});
window.addEventListener('beforeunload',save);

load();
// make sure old/partial saves have all keys
for(const k of['workouts','plans','logs','weights','foods','meals','foodLog','custom','exnotes'])if(!S[k])S[k]=(k==='logs')?[]:{};
if(S.baseCount==null)S.baseCount=142;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().then(v=>{PERSISTED=v})}catch(e){}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(S.active&&!topv())ui.stack=[{t:'active'}];
render(false);
</script>
</body>
